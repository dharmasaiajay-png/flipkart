<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extended E-Commerce</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #333; color: #fff; padding: 15px; text-align: center; }
    nav a { color: #fff; margin: 0 10px; text-decoration: none; }
    .search-bar { margin: 15px auto; text-align: center; }
    .search-bar input { padding: 8px; width: 60%; }
    .categories { display: flex; justify-content: center; margin: 20px 0; }
    .categories button { margin: 0 10px; padding: 10px 15px; background: #007bff; color: #fff; border: none; cursor: pointer; }
    .products { display: flex; flex-wrap: wrap; padding: 20px; justify-content: center; }
    .product { border: 1px solid #ccc; border-radius: 5px; margin: 10px; padding: 15px; width: 200px; text-align: center; }
    .product img { width: 100%; height: auto; }
    .product button { background: #28a745; color: #fff; border: none; padding: 10px; cursor: pointer; }
    .cart { background: #f8f9fa; padding: 20px; text-align: center; border-top: 2px solid #ccc; }
    footer { background: #333; color: #fff; text-align: center; padding: 15px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>My Shop</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" placeholder="Search products...">
  </div>

  <!-- Categories -->
  <div class="categories">
    <button>Electronics</button>
    <button>Clothing</button>
    <button>Books</button>
    <button>Accessories</button>
  </div>

  <!-- Products Section -->
  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product 1">
      <h2>Smartphone</h2>
      <p>$299.00</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product 2">
      <h2>T-Shirt</h2>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product 3">
      <h2>Novel</h2>
      <p>$9.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product 4">
      <h2>Headphones</h2>
      <p>$49.99</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <!-- Cart Section -->
  <div class="cart">
    <h2>Your Cart</h2>
    <p>No items added yet.</p>
  </div>

  <footer>
    <p>&copy; 2026 My Shop. All rights reserved.</p>
  </footer>

</body>
</html>
